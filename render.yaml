services:
  - type: web
    name: feelosophy-backend
    env: node
    region: singapore # hoặc oregon, frankfurt tùy bạn
    plan: free # hoặc starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Các biến khác cần được thêm trong Render Dashboard
      # vì chứa thông tin nhạy cảm
