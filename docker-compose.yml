version: '3.8'
services:
  mongo:
    image: mongo:6
    container_name: mental-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mental
      MONGO_INITDB_ROOT_PASSWORD: mental
    ports:
      - "27019:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
